name: ci

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"   # nightly full evals
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate plugin, skills, hooks, scripts, fixtures, evals, staleness
        run: scripts/validate --staleness
      - name: Script unit checks against fixtures
        run: |
          set -e
          scripts/drupal-profile fixtures/site-current --no-cache | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['drupal']['version']=='11.4.6' and d['router']['class']=='current', d"
          scripts/drupal-profile fixtures/site-previous --no-cache | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['router']['class']=='previous', d"
          scripts/drupal-profile fixtures/site-legacy-d7 --no-cache | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['drupal']['major']==7 and d['router']['class']=='eol', d"
          scripts/drupal-runtime fixtures/site-prodlike | python3 -c "import sys,json; d=json.load(sys.stdin); assert d['environment']['class'] in ('UNKNOWN','PRODUCTION'), d"
          scripts/drupal-runtime fixtures/site-ddev | python3 -c "import sys,json; d=json.load(sys.stdin); assert 'ddev' in d['declared'], d"
          printf '{"cwd":"%s/fixtures/site-prodlike","tool_input":{"command":"drush site:install -y"}}' "$PWD" | CLAUDE_PLUGIN_ROOT=$PWD bash hooks/scripts/guard-bash; test $? -eq 2
          printf '{"cwd":"%s/fixtures/site-prodlike","tool_input":{"command":"drush cim --preview=diff"}}' "$PWD" | CLAUDE_PLUGIN_ROOT=$PWD bash hooks/scripts/guard-bash; test $? -eq 0
          printf '{"jsonrpc":"2.0","id":1,"method":"tools/list"}\n' | python3 fixtures/mcp-stub/server.py | grep -q get_site_status

  evals-trigger:
    # Needs ANTHROPIC_API_KEY (or a Claude Code OAuth token) in repository secrets; skipped otherwise.
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    needs: validate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Trigger / no-trigger evals (deterministic graders only)
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: scripts/run-evals --group trigger --group no-trigger --no-llm --runs 1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-trigger
          path: evals/results/

  evals-full:
    if: ${{ github.event_name == 'schedule' || contains(github.event.pull_request.labels.*.name, 'evals') }}
    runs-on: ubuntu-latest
    needs: validate
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
      - name: Install Claude Code CLI
        run: npm install -g @anthropic-ai/claude-code
      - name: Scenario, agent, and acceptance evals
        if: ${{ env.ANTHROPIC_API_KEY != '' }}
        run: scripts/run-evals --group scenarios --group agents --group acceptance --runs 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results-full
          path: evals/results/
