# Disposable Drupal lab (Docker Compose). Copied by the lab recipe into ${CLAUDE_PLUGIN_DATA}/labs/<name>.
# Usage:  docker compose up -d && docker compose exec php composer create-project drupal/recommended-project:^11.4 . --no-interaction
#         docker compose exec php composer require --dev drupal/core-dev:^11.4 drush/drush:^13
#         docker compose exec php vendor/bin/drush site:install minimal -y --db-url=mysql://drupal:drupal@db/drupal --account-pass=admin
# Teardown: docker compose down -v
services:
  php:
    image: ${DSP_PHP_IMAGE:-php:8.3-cli}
    working_dir: /app
    volumes:
      - ./:/app
    command: ["sh", "-c", "docker-php-ext-install pdo_mysql gd zip opcache >/dev/null 2>&1 || true; tail -f /dev/null"]
    environment:
      COMPOSER_ALLOW_SUPERUSER: "1"
      SIMPLETEST_DB: mysql://drupal:drupal@db/drupal
      SIMPLETEST_BASE_URL: http://web
      BROWSERTEST_OUTPUT_DIRECTORY: /app/web/sites/simpletest/browser_output
    depends_on:
      - db
  web:
    image: ${DSP_PHP_IMAGE:-php:8.3-cli}
    working_dir: /app/web
    volumes:
      - ./:/app
    command: ["php", "-S", "0.0.0.0:80", ".ht.router.php"]
    ports:
      - "${DSP_WEB_PORT:-8090}:80"
    depends_on:
      - db
  db:
    image: mariadb:10.11
    environment:
      MARIADB_DATABASE: drupal
      MARIADB_USER: drupal
      MARIADB_PASSWORD: drupal
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - dbdata:/var/lib/mysql
volumes:
  dbdata: {}
